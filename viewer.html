<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Novacort</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background:
      linear-gradient(
        135deg,
        #2a2a2a,
        #1d1d1d
      );

    }

    model-viewer {

      width: 100vw;

      height: 100dvh;

      background: transparent;

    }

.titulo {

  position: absolute;

  top: 18px;
  left: 18px;

  z-index: 100;

  color:
  rgba(255,255,255,0.92);

  font-size: 22px;

  font-weight: 700;

  letter-spacing: 1px;

  pointer-events: none;

}

    .instructions {

  position: absolute;

  bottom: 20px;
  left: 20px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  gap: 10px;

  padding: 14px 18px;

  border-radius: 18px;

  background:
  rgba(0,0,0,0.22);

  backdrop-filter:
  blur(12px);

  color:
  rgba(255,255,255,0.82);

  font-size: 13px;

  line-height: 1.5;

}

.configurator {

  position: absolute;

  top: 18px;
  right: 18px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  gap: 8px;

}

.config-btn {

  width: 118px;

  padding: 9px 12px;

  border: none;

  border-radius: 16px;

  background:
  rgba(255,255,255,0.08);

  color: white;

  cursor: pointer;

  font-size: 13px;

  transition:
  background 0.25s ease,
  transform 0.25s ease;

  backdrop-filter:
  blur(10px);

  text-align: center;

}

    .config-btn:hover {

      transform:
      translateY(-2px);

      background:
      rgba(255,255,255,0.15);

    }

    .config-btn.active {

      background: white;

      color: black;

    }

.material-picker {

  position: absolute;

  bottom: 20px;
  right: 20px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  gap: 12px;

  padding: 12px;

  border-radius: 24px;

  background:
  rgba(0,0,0,0.28);

  backdrop-filter:
  blur(14px);

}

.material-toggle {

  border: none;

  background:
  rgba(255,255,255,0.08);

  color: white;

  border-radius: 999px;

  padding:
  10px 16px;

  cursor: pointer;

  font-weight: 600;

}

.material-content {

  display: flex;

  flex-direction: column;

  gap: 12px;

  overflow: hidden;

  transition:
  max-height 0.3s ease,
  opacity 0.3s ease;

  max-height: 300px;

  opacity: 1;

}

.material-picker.collapsed
.material-content {

  max-height: 0;

  opacity: 0;

}

#materialButtons {

  display: flex;

  flex-direction: column;

  gap: 10px;

  align-items: center;

}

    .material-title {

      color: white;

      font-size: 14px;

      font-weight: 600;

      letter-spacing: 0.5px;

    }

    #materialButtons {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .material-swatch {

  width: 34px;
  height: 34px;

  border-radius: 50%;

  border:
  2px solid rgba(255,255,255,0.25);

  cursor: pointer;

  transition:
  transform 0.25s ease,
  border 0.25s ease,
  box-shadow 0.25s ease;

}

.material-swatch:hover {

  transform:
  scale(1.08);

  border:
  2px solid white;

}

.material-swatch.active {

  border:
  3px solid white;

  box-shadow:
  0 0 16px rgba(255,255,255,0.45);

}

    .material-btn {

      padding:
      10px 18px;

      border: none;

      border-radius: 999px;

      background:
      rgba(255,255,255,0.12);

      color: white;

      cursor: pointer;

      transition:
      0.25s ease;

      min-width: 120px;

      text-align: center;

    }

    .material-btn:hover {

      background:
      rgba(255,255,255,0.22);

      transform:
      translateY(-2px);

    }

    .material-btn.active {

      border:
      2px solid white;

      background:
      rgba(255,255,255,0.3);

    }

    .hotspot {

      position: relative;

      display: block;

      border: none;

      background: transparent;

      cursor: pointer;

      z-index: 50;

      opacity: 1;

      visibility: visible;

      transition:
      opacity 0.25s ease,
      transform 0.25s ease;

    }

    .dot {

      position: relative;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: white;

      border: 3px solid #111;

      pointer-events: none;

      box-shadow:
      0 0 18px rgba(255,255,255,0.75);

      animation:
      pulse 2s infinite;

    }

    .tooltip {

      position: absolute;

      left: 30px;
      top: -25px;

      width: 240px;

      padding: 16px;

      border-radius: 18px;

      background:
      rgba(20,20,20,0.78);

      color: white;

      opacity: 0;

      transform:
      translateY(10px);

      transition:
      opacity 0.25s ease,
      transform 0.25s ease;

      pointer-events: none;

      backdrop-filter:
      blur(14px);

    }

    .hotspot.active .tooltip {

      opacity: 1;

      transform:
      translateY(0);

    }

    @keyframes pulse {

      0% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.08);

      }

      100% {

        transform: scale(1);

      }

    }

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .titulo {

    font-size: 18px;

    top: 14px;
    left: 14px;

  }


  .instructions {

    bottom: 14px;
    left: 14px;

    font-size: 11px;

    padding: 10px 12px;

    max-width: 170px;

    border-radius: 16px;

    line-height: 1.4;

    background:
    rgba(0,0,0,0.18);

    opacity: 0.8;

  }


  .configurator {

    top: 18px;

    right: 18px;

    gap: 6px;

  }


.config-btn {

  width: 96px;

  padding: 8px 10px;

  font-size: 11px;

  border-radius: 999px;

}


  .material-picker {

    bottom: 95px;

    right: 14px;

    padding: 0;

    background: transparent;

    backdrop-filter: none;

  }


.material-toggle {

  width: 46px;
  height: 46px;

  border: none;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0;

  background:
  rgba(0,0,0,0.45);

  color: white;

  cursor: pointer;

  font-size: 20px;

  backdrop-filter:
  blur(12px);

  box-shadow:
  0 0 20px rgba(0,0,0,0.25);

}


  .material-content {

    position: absolute;

    bottom: 60px;
    right: 0;

    flex-direction: row;

    background:
    rgba(0,0,0,0.28);

    backdrop-filter:
    blur(14px);

    padding: 10px;

    border-radius: 999px;

    gap: 10px;

  }


  .material-picker.collapsed
  .material-content {

    opacity: 0;

    pointer-events: none;

    transform:
    translateY(10px);

  }


  .material-picker:not(.collapsed)
  .material-content {

    opacity: 1;

    transform:
    translateY(0);

    transition:
    0.25s ease;

  }


  .material-swatch {

    width: 30px;
    height: 30px;

  }


  .tooltip {

    width: 170px;

    left: -180px;

    top: -6px;

    font-size: 11px;

    padding: 12px;

  }


}


  </style>

</head>

<body>


  <div class="titulo">

    Novacort

  </div>

  <div class="instructions">

  <div>

    Arrastre para rotar

  </div>

  <div>

    Seleccione un punto para explorar

  </div>

</div>


  <div class="configurator">

    <button
      class="config-btn active"
      data-variant="base">

      Producto

    </button>

    <button
      class="config-btn"
      data-variant="animado">

      Aplicación

    </button>

  </div>


<div class="material-picker collapsed">

  <button
    class="material-toggle"
    onclick="toggleMaterials()">

    🎨

  </button>

  <div class="material-content">

    <div id="materialButtons"></div>

  </div>

</div>


  <model-viewer

    id="viewer"

    src=""

    camera-controls
   
    disable-tap

    interpolation-decay="120"

    min-camera-orbit="auto auto 0.08m"

    max-camera-orbit="auto auto 12m"

    interaction-prompt="none"

    touch-action="pan-y"

    shadow-intensity="2.5"

    exposure="0.8"

    environment-image="hdri/studio3.hdr"

    environment-rotation="60deg"

    tone-mapping="commerce"

    ar>

  </model-viewer>


  <script>

    const viewer =
      document.querySelector("#viewer");

    const buttons =
      document.querySelectorAll(".config-btn");

    let productData;

    let currentVariant = "base";

    let autoRotateInterval;

    let inactivityTimer;

    let isDragging = false;


    async function loadProduct() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const product =
        (
          params.get("product") ||
          "cuadrado"
        ).toLowerCase();

      const response =
        await fetch(
          `./config/${product}.json`
        );

      productData =
        await response.json();

      createHotspots();

      setVariant("base");

      setupConfigurator();

      setupMaterials();

      setTimeout(() => {

        startAutoRotate();

      }, 4000);

    }


    function createHotspots() {

      if (!productData.hotspots)
        return;

      productData.hotspots.forEach((hotspotData, index) => {

        const hotspot =
          document.createElement("button");

        hotspot.className =
          "hotspot";

        hotspot.slot =
          `hotspot-${index + 1}`;

        hotspot.setAttribute(
          "data-position",
          hotspotData.position
        );

        hotspot.setAttribute(
          "data-normal",
          "0m 0m 1m"
        );

        hotspot.innerHTML = `

          <div class="dot"></div>

          <div class="tooltip">

            <h3>${hotspotData.title}</h3>

            <p>${hotspotData.description}</p>

          </div>

        `;

        hotspot.addEventListener("click", (event) => {

          event.stopPropagation();

          stopAutoRotate();

          activateHotspot(hotspot);

          viewer.cameraTarget =
            hotspotData.target;

          viewer.cameraOrbit =
            hotspotData.orbit;

          viewer.fieldOfView =
            hotspotData.fov;

        });

        viewer.appendChild(hotspot);

      });

    }


function setVariant(variant) {

  currentVariant =
    variant;

  const variantData =
    productData
    .variants[variant];

  const isMobile =
    window.innerWidth <= 768;


  // =========================
  // BUTTONS
  // =========================

  buttons.forEach((btn) => {

    btn.classList.remove("active");

  });

  document
    .querySelector(
      `[data-variant="${variant}"]`
    )
    ?.classList
    .add("active");


  // =========================
  // MODEL
  // =========================

  viewer.src =
    variantData.model;


  // =========================
  // MODEL READY
  // =========================

  viewer.addEventListener("load", () => {


    // =========================
    // MOBILE CAMERA
    // =========================

    if (
      isMobile &&
      variantData.mobileCameraOrbit
    ) {

      viewer.cameraOrbit =
        variantData.mobileCameraOrbit;

    }

    else {

      viewer.cameraOrbit =
        variantData.cameraOrbit;

    }


    // =========================
    // TARGET
    // =========================

    if (
      isMobile &&
      variantData.mobileCameraTarget
    ) {

      viewer.cameraTarget =
        variantData.mobileCameraTarget;

    }

    else {

      viewer.cameraTarget =
        variantData.cameraTarget;

    }


    // =========================
    // FOV
    // =========================

    viewer.fieldOfView =
      variantData.fov;


    updateHotspotsVisibility();

    resetHotspots();

    viewer.play();

  }, { once: true });

}

function applyCamera(variantData) {

  const isMobile =
    window.innerWidth <= 768;


  // =========================
  // CAMERA ORBIT
  // =========================

  if (
    isMobile &&
    variantData.mobileCameraOrbit
  ) {

    viewer.cameraOrbit =
      variantData.mobileCameraOrbit;

  }

  else {

    viewer.cameraOrbit =
      variantData.cameraOrbit;

  }


  // =========================
  // CAMERA TARGET
  // =========================

  if (
    isMobile &&
    variantData.mobileCameraTarget
  ) {

    viewer.cameraTarget =
      variantData.mobileCameraTarget;

  }

  else {

    viewer.cameraTarget =
      variantData.cameraTarget;

  }


  // =========================
  // FOV
  // =========================

  viewer.fieldOfView =
    variantData.fov;

}

    function setupConfigurator() {

      buttons.forEach((button) => {

        button.addEventListener("click", () => {

          const variant =
            button.dataset.variant;

          stopAutoRotate();

          clearTimeout(inactivityTimer);

          setVariant(variant);

        });

      });

    }


function setupMaterials() {

  const container =
    document.getElementById(
      "materialButtons"
    );

  container.innerHTML = "";

  if (!productData.materials)
    return;


  productData.materials.forEach(
    (material, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "material-swatch";

      button.dataset.material =
        material.name;

      button.title =
        material.name;


      if (index === 0) {

        button.classList.add(
          "active"
        );

      }


      if (material.gradient) {

        button.style.background =
          material.gradient;

      }

      else {

        button.style.background =
          material.color;

      }


      button.onclick = () => {

        setMaterial(
          material.name
        );

      };


      container.appendChild(
        button
      );

    }
  );

}



window.setMaterial = function(name) {

  viewer.variantName =
    name;

  document
    .querySelectorAll(".material-swatch")
    .forEach((btn) => {

      btn.classList.remove(
        "active"
      );

      if (
        btn.dataset.material === name
      ) {

        btn.classList.add(
          "active"
        );

      }

    });

}


function toggleMaterials() {

  document
    .querySelector(
      ".material-picker"
    )
    .classList
    .toggle("collapsed");

}

    function updateHotspotsVisibility() {

      const hotspots =
        document.querySelectorAll(
          ".hotspot"
        );

      const hideHotspots =
        currentVariant === "animado";

      hotspots.forEach((hotspot) => {

        hotspot.style.opacity =
          hideHotspots ? "0" : "1";

        hotspot.style.visibility =
          hideHotspots
            ? "hidden"
            : "visible";

        hotspot.style.pointerEvents =
          hideHotspots
            ? "none"
            : "auto";

      });

    }


    function activateHotspot(activeHotspot) {

      document
        .querySelectorAll(".hotspot")
        .forEach((hotspot) => {

          hotspot.classList.remove(
            "active"
          );

        });

      activeHotspot.classList.add(
        "active"
      );

    }


    function resetHotspots() {

      document
        .querySelectorAll(".hotspot")
        .forEach((hotspot) => {

          hotspot.classList.remove(
            "active"
          );

        });

    }


    function resetCamera() {

      const variantData =
        productData
        .variants[currentVariant];

      applyCamera(variantData);

      resetHotspots();

    }


    function startAutoRotate() {

      if (!productData.autoRotate)
        return;

      stopAutoRotate();

      autoRotateInterval =
        setInterval(() => {

          const orbit =
            viewer.getCameraOrbit();

          const theta =
            orbit.theta +
            (
              productData.autoRotateSpeed *
              Math.PI / 180
            );

          viewer.cameraOrbit =
            `${theta}rad ${orbit.phi}rad ${orbit.radius}m`;

        }, 16);

    }


    function stopAutoRotate() {

      if (autoRotateInterval) {

        clearInterval(
          autoRotateInterval
        );

        autoRotateInterval =
          null;

      }

    }


    viewer.addEventListener("pointerdown", () => {

      isDragging = false;

      stopAutoRotate();

      clearTimeout(inactivityTimer);

    });


    viewer.addEventListener("pointermove", () => {

      isDragging = true;

      clearTimeout(inactivityTimer);

      inactivityTimer =
        setTimeout(() => {

          startAutoRotate();

        }, 6000);

    });


    viewer.addEventListener("pointerup", (event) => {

      const hotspot =
        event.target.closest(
          ".hotspot"
        );

      if (!isDragging && !hotspot) {

        resetCamera();

      }

    });


    function radToDeg(rad) {

      return (
        rad * 180 / Math.PI
      ).toFixed(1);

    }


    viewer.addEventListener("camera-change", () => {

      const orbit =
        viewer.getCameraOrbit();

      const target =
        viewer.getCameraTarget();

      console.clear();

      console.log(`

camera-orbit="${radToDeg(orbit.theta)}deg ${radToDeg(orbit.phi)}deg ${orbit.radius.toFixed(2)}m"

camera-target="${target.x.toFixed(3)}m ${target.y.toFixed(3)}m ${target.z.toFixed(3)}m"

      `);

    });


    loadProduct();

  </script>

</body>

</html>
