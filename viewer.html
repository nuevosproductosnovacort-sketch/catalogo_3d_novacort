<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Novacort</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background:
      linear-gradient(
        135deg,
        #2a2a2a,
        #1d1d1d
      );

    }

    model-viewer {

      width: 100vw;

      height: 100dvh;

      background: transparent;

    }

    .titulo {

      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 100;

      color:
      rgba(255,255,255,0.88);

      font-size: 24px;

      font-weight: bold;

      letter-spacing: 1px;

      pointer-events: none;

    }

    .instructions {

  position: absolute;

  bottom: 20px;
  left: 20px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  gap: 10px;

  padding: 14px 18px;

  border-radius: 18px;

  background:
  rgba(0,0,0,0.22);

  backdrop-filter:
  blur(12px);

  color:
  rgba(255,255,255,0.82);

  font-size: 13px;

  line-height: 1.5;

}

.configurator {

  position: absolute;

  top: 20px;
  right: 20px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  gap: 12px;

}

.config-btn {

  width: 160px;

  padding: 12px 18px;

  border: none;

  border-radius: 16px;

  background:
  rgba(255,255,255,0.08);

  color: white;

  cursor: pointer;

  font-size: 13px;

  transition:
  background 0.25s ease,
  transform 0.25s ease;

  backdrop-filter:
  blur(10px);

  text-align: center;

}

    .config-btn:hover {

      transform:
      translateY(-2px);

      background:
      rgba(255,255,255,0.15);

    }

    .config-btn.active {

      background: white;

      color: black;

    }

.material-picker {

  position: absolute;

  bottom: 20px;
  right: 20px;

  z-index: 100;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  gap: 12px;

  padding: 14px;

  border-radius: 18px;

  background:
  rgba(0,0,0,0.25);

  backdrop-filter:
  blur(12px);

}

    .material-title {

      color: white;

      font-size: 14px;

      font-weight: 600;

      letter-spacing: 0.5px;

    }

    #materialButtons {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .material-swatch {

  width: 34px;
  height: 34px;

  border-radius: 50%;

  border:
  2px solid rgba(255,255,255,0.25);

  cursor: pointer;

  transition:
  transform 0.25s ease,
  border 0.25s ease,
  box-shadow 0.25s ease;

}

.material-swatch:hover {

  transform:
  scale(1.08);

  border:
  2px solid white;

}

.material-swatch.active {

  border:
  3px solid white;

  box-shadow:
  0 0 16px rgba(255,255,255,0.45);

}

    .material-btn {

      padding:
      10px 18px;

      border: none;

      border-radius: 999px;

      background:
      rgba(255,255,255,0.12);

      color: white;

      cursor: pointer;

      transition:
      0.25s ease;

      min-width: 120px;

      text-align: center;

    }

    .material-btn:hover {

      background:
      rgba(255,255,255,0.22);

      transform:
      translateY(-2px);

    }

    .material-btn.active {

      border:
      2px solid white;

      background:
      rgba(255,255,255,0.3);

    }

    .hotspot {

      position: relative;

      display: block;

      border: none;

      background: transparent;

      cursor: pointer;

      z-index: 50;

      opacity: 1;

      visibility: visible;

      transition:
      opacity 0.25s ease,
      transform 0.25s ease;

    }

    .dot {

      position: relative;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: white;

      border: 3px solid #111;

      pointer-events: none;

      box-shadow:
      0 0 18px rgba(255,255,255,0.75);

      animation:
      pulse 2s infinite;

    }

    .tooltip {

      position: absolute;

      left: 30px;
      top: -25px;

      width: 240px;

      padding: 16px;

      border-radius: 18px;

      background:
      rgba(20,20,20,0.78);

      color: white;

      opacity: 0;

      transform:
      translateY(10px);

      transition:
      opacity 0.25s ease,
      transform 0.25s ease;

      pointer-events: none;

      backdrop-filter:
      blur(14px);

    }

    .hotspot.active .tooltip {

      opacity: 1;

      transform:
      translateY(0);

    }

    @keyframes pulse {

      0% {

        transform: scale(1);

      }

      50% {

        transform: scale(1.08);

      }

      100% {

        transform: scale(1);

      }

    }

  </style>

</head>

<body>


  <div class="titulo">

    Novacort

  </div>

  <div class="instructions">

  <div>

    Arrastre para rotar

  </div>

  <div>

    Seleccione un punto para explorar

  </div>

</div>


  <div class="configurator">

    <button
      class="config-btn active"
      data-variant="base">

      Solo cortinero

    </button>

    <button
      class="config-btn"
      data-variant="animado">

      Aplicación

    </button>

  </div>


  <div class="material-picker">

    <div class="material-title">

      Color

    </div>

    <div id="materialButtons"></div>

  </div>


  <model-viewer

    id="viewer"

    src=""

    camera-controls
   
    disable-tap

    interpolation-decay="120"

    min-camera-orbit="auto auto 0.08m"

    max-camera-orbit="auto auto 12m"

    interaction-prompt="none"

    touch-action="pan-y"

    shadow-intensity="2.5"

    exposure="0.8"

    environment-image="hdri/studio3.hdr"

    environment-rotation="60deg"

    tone-mapping="commerce"

    ar>

  </model-viewer>


  <script>

    const viewer =
      document.querySelector("#viewer");

    const buttons =
      document.querySelectorAll(".config-btn");

    let productData;

    let currentVariant = "base";

    let autoRotateInterval;

    let inactivityTimer;

    let isDragging = false;


    async function loadProduct() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const product =
        (
          params.get("product") ||
          "cuadrado"
        ).toLowerCase();

      const response =
        await fetch(
          `./config/${product}.json`
        );

      productData =
        await response.json();

      createHotspots();

      setVariant("base");

      setupConfigurator();

      setupMaterials();

      setTimeout(() => {

        startAutoRotate();

      }, 4000);

    }


    function createHotspots() {

      if (!productData.hotspots)
        return;

      productData.hotspots.forEach((hotspotData, index) => {

        const hotspot =
          document.createElement("button");

        hotspot.className =
          "hotspot";

        hotspot.slot =
          `hotspot-${index + 1}`;

        hotspot.setAttribute(
          "data-position",
          hotspotData.position
        );

        hotspot.setAttribute(
          "data-normal",
          "0m 0m 1m"
        );

        hotspot.innerHTML = `

          <div class="dot"></div>

          <div class="tooltip">

            <h3>${hotspotData.title}</h3>

            <p>${hotspotData.description}</p>

          </div>

        `;

        hotspot.addEventListener("click", (event) => {

          event.stopPropagation();

          stopAutoRotate();

          activateHotspot(hotspot);

          viewer.cameraTarget =
            hotspotData.target;

          viewer.cameraOrbit =
            hotspotData.orbit;

          viewer.fieldOfView =
            hotspotData.fov;

        });

        viewer.appendChild(hotspot);

      });

    }


    function setVariant(variant) {

      currentVariant =
        variant;

      const variantData =
        productData
        .variants[variant];

      buttons.forEach((btn) => {

        btn.classList.remove("active");

      });

      document
        .querySelector(
          `[data-variant="${variant}"]`
        )
        ?.classList
        .add("active");

      viewer.src =
        variantData.model;

      viewer.addEventListener("load", () => {

        applyCamera(variantData);

        updateHotspotsVisibility();

        resetHotspots();

        viewer.play();

      }, { once: true });

    }


    function applyCamera(variantData) {

      viewer.cameraOrbit =
        variantData.cameraOrbit;

      viewer.cameraTarget =
        variantData.cameraTarget;

      viewer.fieldOfView =
        variantData.fov;

    }


    function setupConfigurator() {

      buttons.forEach((button) => {

        button.addEventListener("click", () => {

          const variant =
            button.dataset.variant;

          stopAutoRotate();

          clearTimeout(inactivityTimer);

          setVariant(variant);

        });

      });

    }


function setupMaterials() {

  const container =
    document.getElementById(
      "materialButtons"
    );

  container.innerHTML = "";

  if (!productData.materials)
    return;


  const colors = {

    Blanco:
      "#f5f5f5",

    Negro:
      "#1a1a1a",

    Beige:
      "#c9b39a",

    Cromo:
      "linear-gradient(135deg,#f5f5f5,#8a8a8a,#ffffff,#6d6d6d)"

  };


  productData.materials.forEach(
    (material, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "material-swatch";

      button.dataset.material =
        material;

      button.title =
        material;


      if (index === 0) {

        button.classList.add(
          "active"
        );

      }


      if (material === "Cromo") {

        button.style.background =
          colors[material];

      }

      else {

        button.style.backgroundColor =
          colors[material];

      }


      button.onclick = () => {

        setMaterial(material);

      };


      container.appendChild(
        button
      );

    }
  );

}


window.setMaterial = function(name) {

  viewer.variantName =
    name;

  document
    .querySelectorAll(".material-swatch")
    .forEach((btn) => {

      btn.classList.remove(
        "active"
      );

      if (
        btn.dataset.material === name
      ) {

        btn.classList.add(
          "active"
        );

      }

    });

}

    function updateHotspotsVisibility() {

      const hotspots =
        document.querySelectorAll(
          ".hotspot"
        );

      const hideHotspots =
        currentVariant === "animado";

      hotspots.forEach((hotspot) => {

        hotspot.style.opacity =
          hideHotspots ? "0" : "1";

        hotspot.style.visibility =
          hideHotspots
            ? "hidden"
            : "visible";

        hotspot.style.pointerEvents =
          hideHotspots
            ? "none"
            : "auto";

      });

    }


    function activateHotspot(activeHotspot) {

      document
        .querySelectorAll(".hotspot")
        .forEach((hotspot) => {

          hotspot.classList.remove(
            "active"
          );

        });

      activeHotspot.classList.add(
        "active"
      );

    }


    function resetHotspots() {

      document
        .querySelectorAll(".hotspot")
        .forEach((hotspot) => {

          hotspot.classList.remove(
            "active"
          );

        });

    }


    function resetCamera() {

      const variantData =
        productData
        .variants[currentVariant];

      applyCamera(variantData);

      resetHotspots();

    }


    function startAutoRotate() {

      if (!productData.autoRotate)
        return;

      stopAutoRotate();

      autoRotateInterval =
        setInterval(() => {

          const orbit =
            viewer.getCameraOrbit();

          const theta =
            orbit.theta +
            (
              productData.autoRotateSpeed *
              Math.PI / 180
            );

          viewer.cameraOrbit =
            `${theta}rad ${orbit.phi}rad ${orbit.radius}m`;

        }, 16);

    }


    function stopAutoRotate() {

      if (autoRotateInterval) {

        clearInterval(
          autoRotateInterval
        );

        autoRotateInterval =
          null;

      }

    }


    viewer.addEventListener("pointerdown", () => {

      isDragging = false;

      stopAutoRotate();

      clearTimeout(inactivityTimer);

    });


    viewer.addEventListener("pointermove", () => {

      isDragging = true;

      clearTimeout(inactivityTimer);

      inactivityTimer =
        setTimeout(() => {

          startAutoRotate();

        }, 6000);

    });


    viewer.addEventListener("pointerup", (event) => {

      const hotspot =
        event.target.closest(
          ".hotspot"
        );

      if (!isDragging && !hotspot) {

        resetCamera();

      }

    });


    function radToDeg(rad) {

      return (
        rad * 180 / Math.PI
      ).toFixed(1);

    }


    viewer.addEventListener("camera-change", () => {

      const orbit =
        viewer.getCameraOrbit();

      const target =
        viewer.getCameraTarget();

      console.clear();

      console.log(`

camera-orbit="${radToDeg(orbit.theta)}deg ${radToDeg(orbit.phi)}deg ${orbit.radius.toFixed(2)}m"

camera-target="${target.x.toFixed(3)}m ${target.y.toFixed(3)}m ${target.z.toFixed(3)}m"

      `);

    });


    loadProduct();

  </script>

</body>

</html>
